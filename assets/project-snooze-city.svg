<svg width="920" height="112" viewBox="0 0 920 112" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff41" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00ff41" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#00ff41" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="919" height="111" rx="10" fill="#161b22" stroke="#30363d"/>
  <rect x="0" y="16" width="3" height="80" rx="1.5" fill="#00ff41"/>

  <g font-family="ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace">
    <text x="24" y="38" font-size="20" font-weight="700" letter-spacing="2" fill="#00ff41" filter="url(#glow)">SNOOZE_CITY</text>

    <rect x="776" y="20" width="120" height="26" rx="4" stroke="#ff5f56" stroke-width="1.2"/>
    <text x="836" y="37" text-anchor="middle" font-size="12" font-weight="700" fill="#ff5f56">CLASSIFIED</text>

    <text x="24" y="64" font-size="13" fill="#8b949e">role: Game Director   ·   genre: [REDACTED]   ·   release: [REDACTED]</text>

    <rect x="24" y="78" width="560" height="8" rx="4" fill="#0d1117" stroke="#21262d"/>
    <rect x="24" y="78" width="140" height="8" rx="4" fill="url(#scan)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 420 0; 0 0" dur="3.8s" repeatCount="indefinite"/>
    </rect>

    <circle cx="604" cy="82" r="3" fill="#00ff41">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="614" y="86" font-size="12" fill="#00ff41">in active development</text>
  </g>
</svg>
