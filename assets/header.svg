<svg width="920" height="252" viewBox="0 0 920 252" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff41" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00ff41" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#00ff41" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#00ff41" opacity="0.045"/>
    </pattern>
    <clipPath id="win">
      <rect x="60" y="14" width="800" height="216" rx="10"/>
    </clipPath>
  </defs>

  <!-- window body -->
  <rect x="60" y="14" width="800" height="216" rx="10" fill="#0d1117"/>

  <!-- matrix rain -->
  <g clip-path="url(#win)" font-family="ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace" font-size="12" fill="#00ff41">
    <g opacity="0.12">
      <text><tspan x="120" y="0">7</tspan><tspan x="120" dy="15">K</tspan><tspan x="120" dy="15">0</tspan><tspan x="120" dy="15">$</tspan><tspan x="120" dy="15">3</tspan><tspan x="120" dy="15">X</tspan><tspan x="120" dy="15">1</tspan><tspan x="120" dy="15">F</tspan><tspan x="120" dy="15">9</tspan><tspan x="120" dy="15">#</tspan><tspan x="120" dy="15">A</tspan><tspan x="120" dy="15">4</tspan></text>
      <animateTransform attributeName="transform" type="translate" from="0 -190" to="0 250" dur="6s" begin="-0.5s" repeatCount="indefinite"/>
    </g>
    <g opacity="0.09">
      <text><tspan x="230" y="0">Z</tspan><tspan x="230" dy="15">1</tspan><tspan x="230" dy="15">8</tspan><tspan x="230" dy="15">%</tspan><tspan x="230" dy="15">D</tspan><tspan x="230" dy="15">0</tspan><tspan x="230" dy="15">5</tspan><tspan x="230" dy="15">W</tspan><tspan x="230" dy="15">2</tspan><tspan x="230" dy="15">+</tspan><tspan x="230" dy="15">E</tspan><tspan x="230" dy="15">7</tspan></text>
      <animateTransform attributeName="transform" type="translate" from="0 -190" to="0 250" dur="7.5s" begin="-2s" repeatCount="indefinite"/>
    </g>
    <g opacity="0.14">
      <text><tspan x="340" y="0">0</tspan><tspan x="340" dy="15">9</tspan><tspan x="340" dy="15">M</tspan><tspan x="340" dy="15">2</tspan><tspan x="340" dy="15">&amp;</tspan><tspan x="340" dy="15">6</tspan><tspan x="340" dy="15">R</tspan><tspan x="340" dy="15">1</tspan><tspan x="340" dy="15">T</tspan><tspan x="340" dy="15">0</tspan><tspan x="340" dy="15">8</tspan><tspan x="340" dy="15">V</tspan></text>
      <animateTransform attributeName="transform" type="translate" from="0 -190" to="0 250" dur="5.5s" begin="-3.5s" repeatCount="indefinite"/>
    </g>
    <g opacity="0.08">
      <text><tspan x="470" y="0">4</tspan><tspan x="470" dy="15">C</tspan><tspan x="470" dy="15">7</tspan><tspan x="470" dy="15">*</tspan><tspan x="470" dy="15">1</tspan><tspan x="470" dy="15">N</tspan><tspan x="470" dy="15">0</tspan><tspan x="470" dy="15">3</tspan><tspan x="470" dy="15">H</tspan><tspan x="470" dy="15">5</tspan><tspan x="470" dy="15">2</tspan><tspan x="470" dy="15">Q</tspan></text>
      <animateTransform attributeName="transform" type="translate" from="0 -190" to="0 250" dur="8s" begin="-1s" repeatCount="indefinite"/>
    </g>
    <g opacity="0.13">
      <text><tspan x="590" y="0">B</tspan><tspan x="590" dy="15">5</tspan><tspan x="590" dy="15">0</tspan><tspan x="590" dy="15">J</tspan><tspan x="590" dy="15">8</tspan><tspan x="590" dy="15">=</tspan><tspan x="590" dy="15">2</tspan><tspan x="590" dy="15">Y</tspan><tspan x="590" dy="15">6</tspan><tspan x="590" dy="15">1</tspan><tspan x="590" dy="15">P</tspan><tspan x="590" dy="15">0</tspan></text>
      <animateTransform attributeName="transform" type="translate" from="0 -190" to="0 250" dur="6.5s" begin="-4s" repeatCount="indefinite"/>
    </g>
    <g opacity="0.10">
      <text><tspan x="700" y="0">6</tspan><tspan x="700" dy="15">G</tspan><tspan x="700" dy="15">3</tspan><tspan x="700" dy="15">@</tspan><tspan x="700" dy="15">0</tspan><tspan x="700" dy="15">L</tspan><tspan x="700" dy="15">9</tspan><tspan x="700" dy="15">4</tspan><tspan x="700" dy="15">S</tspan><tspan x="700" dy="15">7</tspan><tspan x="700" dy="15">1</tspan><tspan x="700" dy="15">U</tspan></text>
      <animateTransform attributeName="transform" type="translate" from="0 -190" to="0 250" dur="9s" begin="-2.5s" repeatCount="indefinite"/>
    </g>
    <g opacity="0.12">
      <text><tspan x="810" y="0">1</tspan><tspan x="810" dy="15">X</tspan><tspan x="810" dy="15">5</tspan><tspan x="810" dy="15">!</tspan><tspan x="810" dy="15">7</tspan><tspan x="810" dy="15">0</tspan><tspan x="810" dy="15">K</tspan><tspan x="810" dy="15">2</tspan><tspan x="810" dy="15">9</tspan><tspan x="810" dy="15">F</tspan><tspan x="810" dy="15">3</tspan><tspan x="810" dy="15">D</tspan></text>
      <animateTransform attributeName="transform" type="translate" from="0 -190" to="0 250" dur="7s" begin="-5s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- chrome bar -->
  <g clip-path="url(#win)">
    <rect x="60" y="14" width="800" height="34" fill="#161b22"/>
    <circle cx="84" cy="31" r="5.5" fill="#ff5f56"/>
    <circle cx="104" cy="31" r="5.5" fill="#ffbd2e"/>
    <circle cx="124" cy="31" r="5.5" fill="#27c93f"/>
    <text x="460" y="35" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace" font-size="12" fill="#8b949e">txdo@dev: ~ — bash</text>
  </g>

  <!-- terminal content -->
  <g font-family="ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace">
    <text x="98" y="80" font-size="15">
      <tspan fill="#00ff41">txdo@dev</tspan><tspan fill="#8b949e">:~$ </tspan><tspan fill="#e6edf3">sudo ./wake --target world</tspan>
    </text>
    <text x="822" y="80" text-anchor="end" font-size="12" fill="#3fb950">[ 8/8 agents online ]</text>
    <text x="98" y="104" font-size="13" fill="#3fb950">[ok] modules loaded: kotlin · compose · firebase · kmp</text>

    <text x="98" y="172" font-size="66" font-weight="700" letter-spacing="6" fill="#00ff41" filter="url(#glow)">TXDO</text>
    <rect x="290" y="120" width="32" height="56" fill="#00ff41">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <text x="98" y="208" font-size="15" fill="#8b949e">founder · game director · full-stack developer · 20 · sofia, bulgaria</text>
  </g>

  <!-- scanlines + sweep -->
  <rect x="61" y="48" width="798" height="181" fill="url(#scan)" clip-path="url(#win)"/>
  <rect x="61" y="52" width="798" height="2" fill="#00ff41" opacity="0.08" clip-path="url(#win)">
    <animate attributeName="y" values="52;224;52" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- window border + under-glow -->
  <rect x="60" y="14" width="800" height="216" rx="10" stroke="#30363d" stroke-width="1"/>
  <rect x="60" y="242" width="800" height="2" fill="url(#fade)"/>
</svg>
